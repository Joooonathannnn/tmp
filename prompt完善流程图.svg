<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3878c7"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c58a17"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2e8b57"/>
    </marker>
    <style>
      .title { font: 700 46px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #172033; }
      .subtitle { font: 400 21px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #667085; }
      .boxText { font: 600 26px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #172033; text-anchor: middle; }
      .stepText { font: 700 21px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#f7f9fc"/>
  <circle cx="1080" cy="100" r="150" fill="#eaf2ff"/>
  <circle cx="85" cy="1090" r="125" fill="#e8f7ef"/>

  <text x="600" y="82" class="title" text-anchor="middle">Prompt 题目完善流程</text>
  <text x="600" y="122" class="subtitle" text-anchor="middle">轨迹总结 → 要求补充 → 业务逻辑完善</text>

  <!-- 第一行：从左向右 -->
  <rect x="70" y="190" width="280" height="150" rx="24" fill="#eaf3ff" stroke="#76a9e8" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="105" cy="220" r="21" fill="#3878c7"/>
  <text x="105" y="220" class="stepText">1</text>
  <text x="210" y="250" class="boxText">
    <tspan x="210">缺少 prompt 文件</tspan>
    <tspan x="210" dy="39">的题目</tspan>
  </text>

  <rect x="460" y="190" width="280" height="150" rx="24" fill="#eaf3ff" stroke="#76a9e8" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="250" class="boxText">
    <tspan x="600">读取用户数据</tspan>
    <tspan x="600" dy="39">与代码文件</tspan>
  </text>

  <rect x="850" y="190" width="280" height="150" rx="24" fill="#eaf3ff" stroke="#76a9e8" stroke-width="3" filter="url(#shadow)"/>
  <text x="990" y="250" class="boxText">
    <tspan x="990">总结生成</tspan>
    <tspan x="990" dy="39">初版 prompt</tspan>
  </text>

  <path d="M365 265 H438" class="arrow" stroke="#3878c7" marker-end="url(#arrowBlue)"/>
  <path d="M755 265 H828" class="arrow" stroke="#3878c7" marker-end="url(#arrowBlue)"/>
  <path d="M990 358 V452" class="arrow" stroke="#3878c7" marker-end="url(#arrowBlue)"/>

  <!-- 第二行：从右向左 -->
  <rect x="850" y="480" width="280" height="150" rx="24" fill="#fff5da" stroke="#e0b24c" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="885" cy="510" r="21" fill="#c58a17"/>
  <text x="885" y="510" class="stepText">2</text>
  <text x="990" y="540" class="boxText">
    <tspan x="990">结合轨迹中的</tspan>
    <tspan x="990" dy="39">新增要求</tspan>
  </text>

  <rect x="460" y="480" width="280" height="150" rx="24" fill="#fff5da" stroke="#e0b24c" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="540" class="boxText">
    <tspan x="600">补充 prompt</tspan>
    <tspan x="600" dy="39">任务要求</tspan>
  </text>

  <rect x="70" y="480" width="280" height="150" rx="24" fill="#fff5da" stroke="#e0b24c" stroke-width="3" filter="url(#shadow)"/>
  <text x="210" y="540" class="boxText">
    <tspan x="210">分析</tspan>
    <tspan x="210" dy="39">data-pipeline</tspan>
  </text>

  <path d="M835 555 H762" class="arrow" stroke="#c58a17" marker-end="url(#arrowGold)"/>
  <path d="M445 555 H372" class="arrow" stroke="#c58a17" marker-end="url(#arrowGold)"/>
  <path d="M210 648 V742" class="arrow" stroke="#c58a17" marker-end="url(#arrowGold)"/>

  <!-- 第三行：再次从左向右 -->
  <rect x="70" y="770" width="280" height="150" rx="24" fill="#e8f7ef" stroke="#65b68a" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="105" cy="800" r="21" fill="#2e8b57"/>
  <text x="105" y="800" class="stepText">3</text>
  <text x="210" y="830" class="boxText">
    <tspan x="210">补充 prompt 中的</tspan>
    <tspan x="210" dy="39">业务逻辑说明</tspan>
  </text>

  <rect x="460" y="770" width="360" height="150" rx="75" fill="#dff5e8" stroke="#2e8b57" stroke-width="4" filter="url(#shadow)"/>
  <text x="640" y="830" class="boxText">
    <tspan x="640">输出完善后的</tspan>
    <tspan x="640" dy="39">prompt</tspan>
  </text>

  <path d="M365 845 H438" class="arrow" stroke="#2e8b57" marker-end="url(#arrowGreen)"/>

  <rect x="315" y="1015" width="570" height="66" rx="33" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="600" y="1057" class="subtitle" text-anchor="middle">整体采用“向右 → 向下 ↓ 向左 ←”折返布局</text>
</svg>
